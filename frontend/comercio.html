<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carvão do Pedro - Meu Comércio</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Menu Lateral (Sidebar) -->
        <aside class="sidebar">
            <div class="logo-area">
                <h2>CARVÃO DO PEDRO</h2>
                <span>Área do Comerciante</span>
            </div>
        
            <nav class="nav-menu">
                <a href="painel.html" class="nav-item">📊 Painel</a>
                <a href="produtos.html" class="nav-item">📦 Produtos</a>
                <a href="pedidos.html" class="nav-item">🛒 Pedidos</a>
                <a href="comercio.html" class="nav-item active">⚙️ Meu Comércio</a>
            </nav>

            <div class="sidebar-footer">
                <p>Pedro</p>
                <small>Administrador</small>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="top-header">
                <div>
                    <h1>Meu Comércio</h1>
                    <p>Configure os dados da sua loja e opções de entrega.</p>
                </div>
            </header>

            <!-- Formulário de Configuração -->
            <section class="recent-orders">
                <form class="form-config">
                    <div class="form-group">
                        <label for="nome-loja">Nome do Estabelecimento</label>
                        <input type="text" id="nome-loja" value="Carvão do Pedro" class="form-control">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="telefone">Telefone / WhatsApp</label>
                            <input type="text" id="telefone" value="(11) 98765-4321" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="taxa-entrega">Taxa de Entrega (R$)</label>
                            <input type="text" id="taxa-entrega" value="7,00" class="form-control">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="endereco">Endereço Completo</label>
                        <input type="text" id="endereco" value="Rua das Brasas, 150 - Bairro Centro" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="horario">Horário de Funcionamento</label>
                        <input type="text" id="horario" value="Terça a Domingo: 08:00 - 18:00" class="form-control">
                    </div>

                    <div style="margin-top: 20px;">
                        <button type="button" class="btn-primary">Salvar Alterações</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
